[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-hedge"
version = "1.0.0"
description = "Is Bitcoin the new gold? Regressions of Bitcoin and gold returns and volatility on the Caldara-Iacoviello Geopolitical Risk index."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amirmahdi Shokatabadi"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "statsmodels>=0.13", "matplotlib>=3.5",
                "requests>=2.28", "xlrd>=2.0", "yfinance>=0.2.50"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
